services:
  # Terminates TLS and is the only web port published to the host. Everything
  # else speaks plain HTTP on the internal network, which never leaves Docker.
  # 8443/8080 rather than 443/80: rootless Docker cannot publish privileged
  # ports, so those would make the whole stack fail to start. Keep these in
  # sync with the Caddyfile, which serves the site on the same numbers.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - web

  frontend:
    build: ./frontend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - VITE_GOOGLE_ENABLED=${GOOGLE_ENABLED}
    depends_on:
      - backend
    networks:
      - web

  backend:
    build: ./backend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules
    environment:
      DB_NAME: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DATABASE_TEST_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_TEST_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MFA_KEY: ${MFA_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      REDIS_URL: ${REDIS_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      REFRESH_GRACE_SECONDS: ${REFRESH_GRACE_SECONDS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - web
      - db

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - web

  # Captures every mail the backend sends and shows it in a web UI instead of
  # delivering it. A real SMTP provider would need credentials nobody cloning
  # this repo has, plus outbound network — the feature would be dead on any
  # machine but one. Only the UI port is published; SMTP on 1025 stays internal.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    # :9000 is deliberately not published. The bucket is private and reachable
    # only from the backend — every file a browser sees comes from GET /files/:id.
    # :9001 is the admin console, a developer tool like pgAdmin (see README).
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  pgadmin_data:
  minio_data:
  frontend_node_modules:
  backend_node_modules:
