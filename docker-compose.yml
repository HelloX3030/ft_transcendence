services:
  # Terminates TLS and is the only web port published to the host. Everything
  # else speaks plain HTTP on the internal network, which never leaves Docker.
  # 8443/8080 rather than 443/80: rootless Docker cannot publish privileged
  # ports, so those would make the whole stack fail to start. Keep these in
  # sync with the Caddyfile, which serves the site on the same numbers.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
      # Caddy serves HTTP/3 and advertises it on every response with
      # `alt-svc: h3=":8443"`, which browsers cache for the 30 days that header
      # asks for. Publishing only TCP makes that advertisement a lie: the first
      # visit succeeds over HTTP/2, the browser records the offer, and every
      # later visit tries QUIC against a UDP port with nothing behind it.
      # Chrome races the two and falls back; Safari does not, and fails outright
      # with "Safari cannot establish a connection to the server" — on a site
      # that works perfectly in curl and in a fresh profile, which is what makes
      # it so hard to recognise. Publishing UDP makes the advertisement true.
      - "8443:8443/udp"
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_HOST: ${APP_HOST}
    depends_on:
      - frontend
      - backend
    networks:
      - web

  frontend:
    build: ./frontend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - VITE_GOOGLE_ENABLED=${GOOGLE_ENABLED}
      # Not VITE_-prefixed: this is read by vite.config.ts at startup for
      # allowedHosts, never by the browser.
      - APP_HOST=${APP_HOST}
    depends_on:
      - backend
    networks:
      - web

  backend:
    build: ./backend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules
      # Writable here, read-only in Logstash: this service is the producer.
      - app_logs:/var/log/cinemates
    environment:
      DB_NAME: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DATABASE_TEST_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_TEST_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_ORIGINS: ${APP_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MFA_KEY: ${MFA_KEY}
      # Bearer token Prometheus must present to scrape GET /metrics. The
      # endpoint is reachable only as backend:3000/metrics on this network —
      # Caddy answers 404 for /api/metrics — and this stops the other services
      # on `web` from reading it.
      METRICS_TOKEN: ${METRICS_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT}
      TMDB_RATE_WINDOW_SECONDS: ${TMDB_RATE_WINDOW_SECONDS}
      RECOMMENDER_URL: ${RECOMMENDER_URL}
      ONBOARDING_MAX_GENRES: ${ONBOARDING_MAX_GENRES}
      ONBOARDING_MAX_ACTORS: ${ONBOARDING_MAX_ACTORS}
      ONBOARDING_MAX_DIRECTORS: ${ONBOARDING_MAX_DIRECTORS}
      REDIS_URL: ${REDIS_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      REFRESH_GRACE_SECONDS: ${REFRESH_GRACE_SECONDS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - web
      - db

  # The recommendation engine (Python/FastAPI), owned by the algorithm team and merged
  # in unmodified. It reads ratings/movies/users straight from Postgres and writes only
  # users.feature_vector, which is its column alone (see
  # recommender/recommendation/INTEGRATION.md).
  #
  # No published port and no Caddy route, deliberately: it holds full database
  # credentials, has no authentication of its own, and its /retrain endpoint does not
  # verify the secret it accepts. Being unreachable from the host is what protects it.
  recommender:
    build: ./recommender
    # Same shape as backend/frontend: the image is only a runtime, the code is mounted,
    # dependencies install at start. --reload gives the algorithm team the edit-and-see-it
    # loop the node services already have.
    command: sh -c "pip install -q -r recommendation/requirements.txt && uvicorn recommendation.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./recommender:/app
      # Not a volume on site-packages, the way node_modules is cached: site-packages holds
      # pip itself, so an empty volume there shadows pip and the install cannot run.
      # Caching the wheel downloads instead turns a ~60s reinstall into ~10s.
      - recommender_pip_cache:/root/.cache/pip
      # Writable here, read-only in Logstash: this service is the producer.
      - app_logs:/var/log/cinemates
    environment:
      # The same database the backend uses, composed the same way.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # Absent, the service serves a fixed 10-movie stub pool instead of real candidates.
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Guards POST /retrain. Unset means the endpoint refuses every request.
      RETRAIN_SECRET: ${RETRAIN_SECRET}
      # Outbound TMDB pacing, the same variables the backend reads. The ceiling
      # is per process, so this service and the backend each get their own
      # allowance and TMDB sees the sum.
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT}
      TMDB_RATE_WINDOW_SECONDS: ${TMDB_RATE_WINDOW_SECONDS}
    healthcheck:
      # python:3.11-slim ships no curl and the interpreter is already here.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first boot installs numpy/scipy/scikit-learn before uvicorn binds. Without
      # this the container is reported unhealthy during a normal cold start.
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - web

  # Captures every mail the backend sends and shows it in a web UI instead of
  # delivering it. A real SMTP provider would need credentials nobody cloning
  # this repo has, plus outbound network — the feature would be dead on any
  # machine but one. Only the UI port is published; SMTP on 1025 stays internal.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    # :9000 is deliberately not published. The bucket is private and reachable
    # only from the backend — every file a browser sees comes from GET /files/:id.
    # :9001 is the admin console, a developer tool like pgAdmin (see README).
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

  # Pulls /metrics from every target in prometheus/prometheus.yml and keeps the
  # samples in its own time-series database.
  #
  # No published port, deliberately, for the same reason as the recommender: it
  # has no authentication of any kind, and everything it holds — the route
  # table, traffic volumes, login-failure rates — is a map of the system.
  # Grafana will read it over this network; target health is visible there as
  # the `up` metric without needing its web UI. To reach that UI anyway:
  #
  #   docker compose exec prometheus wget -qO- localhost:9090/api/v1/targets
  #
  # and after editing prometheus.yml, reload without losing the stored data:
  #
  #   docker compose exec prometheus wget --post-data='' -qO- localhost:9090/-/reload
  prometheus:
    image: prom/prometheus:v3.14.0
    # Spelled out because setting `command` replaces the image's default
    # arguments rather than adding to them, so the config path has to come back.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Samples older than this are dropped. Two weeks is enough to see a
      # regression against "the same day last week" without the volume growing
      # without bound.
      - --storage.tsdb.retention.time=15d
      # Enables POST /-/reload, so a scrape-config change does not need a
      # restart. Safe here only because nothing outside this network can ask.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Named volume: without it every restart throws away the history, which is
      # the one thing Prometheus exists to keep.
      - prometheus_data:/prometheus
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics_token
      - source: minio_metrics_token
        target: /etc/prometheus/minio_metrics_token
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - backend
    networks:
      - web

  # Reads Prometheus and draws it. Holds no metrics of its own: every panel is a
  # PromQL query sent to prometheus:9090 over this network.
  #
  # No published port. The only way in is Caddy's /grafana* route on the app's
  # own origin, which means one TLS certificate for the whole stack instead of a
  # second one to accept, and no plaintext Grafana on a host port next to it.
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      # Where Grafana believes it lives. serve_from_sub_path makes it prefix
      # every asset and API path it generates with /grafana, which is why the
      # Caddy route uses `handle` and does not strip the prefix.
      #
      # The host half is the canonical origin, the same one APP_ORIGINS leads
      # with. Reaching the stack over the LAN via APP_HOST still works: with a
      # sub-path set, the UI links itself relatively and only absolute links
      # Grafana mails out would carry this hostname.
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # --- Access ---
      # The default admin/admin is the single most common way a Grafana ends up
      # world-readable. Required in .env; there is no fallback here on purpose.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Both already default to false. Set explicitly because "we turned it off"
      # and "the version we happened to run defaults to off" are not the same
      # claim, and this file is where that claim has to be checkable.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Caddy terminates TLS in front, so the browser's connection really is
      # https even though Grafana itself speaks plain http on this network.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax

      # --- No outbound traffic ---
      # Update checks, usage reporting, the news feed and gravatar all reach the
      # public internet. Off because none of them are wanted, and because a
      # school machine behind a proxy would otherwise spend every page load
      # waiting on requests that cannot complete.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Grafana ships a list of apps it downloads from grafana.com on first
      # start (Loki and traces explorers). Nothing here uses them, and on a
      # machine without outbound internet the install is retried on every boot.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Datasources and, later, dashboards. Read-only: this is the source of
      # truth, and Grafana must never be able to write back over it.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON the provider above points at.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Grafana's own database — users, sessions, dashboard edits made in the
      # UI. Provisioned files are reapplied on every start, so losing this
      # volume costs the login, not the setup.
      - grafana_data:/var/lib/grafana
    healthcheck:
      # Under the sub-path, because serve_from_sub_path moves the API there too.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/grafana/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
    networks:
      - web

  # Receives firing alerts from Prometheus and turns them into notifications.
  # The split matters: Prometheus evaluates rules and knows nothing about email,
  # Alertmanager knows nothing about PromQL and does the grouping, silencing,
  # inhibition and delivery.
  #
  # No published port, like everything else here. Its web UI is where silences
  # are created; reach it with
  #
  #   docker compose exec alertmanager wget -qO- localhost:9093/api/v2/alerts
  #
  # or use `npm run metrics:alerts`, which reads the state from Prometheus. The
  # human-visible output is the mail itself, in Mailpit on :8025.
  alertmanager:
    image: prom/alertmanager:v0.34.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Silences and notification state. Without it, a restart re-notifies about
      # everything currently firing and forgets every silence.
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mailpit
    networks:
      - web

  # --- Exporters -----------------------------------------------------------
  # Postgres and Redis do not speak Prometheus and never will: we do not own
  # their source. Each of these is a translator — it connects as an ordinary
  # client, asks the service for the statistics it already keeps about itself,
  # and republishes them as a /metrics page. Neither Postgres nor Redis is
  # modified, restarted, or aware any of this is happening.
  #
  # None publish a port. Prometheus reaches them by service name on `web`.

  # Runs SELECTs against pg_stat_* — connection counts, cache hit ratio,
  # deadlocks, transaction rates — and reshapes the rows into metrics.
  #
  # Reuses DB_USER rather than a dedicated role. A production deployment would
  # create a login with only the built-in pg_monitor role, so a compromised
  # exporter could read statistics and nothing else; here that would mean a
  # migration and a second credential for a service that already runs beside
  # the database it is reading.
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

  # Issues Redis INFO and turns the reply into metrics: memory against the
  # 256mb cap, keyspace hits and misses, and evictions — which matter here
  # because the cache is allkeys-lru, so under memory pressure it discards
  # entries silently and every discarded entry is a TMDB call we pay for again.
  redis_exporter:
    image: oliver006/redis_exporter:v1.91.1
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - web

  # Not a translator: cAdvisor reads Docker's own resource accounting and
  # reports CPU, memory, network and disk per container. One container covers
  # every service in this file, and it is what turns "the recommender died" into
  # a memory graph that ends at the container limit.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      # Only containers, not every cgroup on the machine. Without this the
      # series count is dominated by systemd slices nothing here asks about.
      - --docker_only=true
      - --housekeeping_interval=10s
      # Container labels become metric labels otherwise, and compose sets
      # several per container — that is cardinality bought for nothing.
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - web

  # The host itself: CPU, memory, load, and disk space. Disk is the reason it is
  # here — nothing else in this stack can see how full the filesystem is, and a
  # full disk stops Postgres and Prometheus at the same time.
  node_exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Pseudo-filesystems and the container's own mounts are not disks anyone
      # can fill; reporting them buries the real ones.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup.*|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|procfs|pstore|securityfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # `rslave` propagation, which the upstream node_exporter documentation
      # suggests, is deliberately not used: Docker Desktop cannot satisfy it
      # ("path / is mounted on / but it is not a shared or slave mount") and the
      # container fails to create, which aborts `docker compose up` for the
      # whole stack on macOS. All it buys is visibility of filesystems mounted
      # *after* this container starts; everything present at boot is reported
      # either way, which on these machines is all of them.
      - /:/host/root:ro
    # Needed to see the host's processes rather than only its own.
    pid: host
    networks:
      - web

  # --- Logging (ELK) --------------------------------------------------------
  # Metrics answer "how many, how fast, is it up"; logs answer "what exactly
  # happened at 02:31". The Prometheus stack above does the first and cannot do
  # the second — a counter has no room for a stack trace or the detail line
  # explaining why a retrain declined to fit a model. These three services do
  # the second, and share nothing with it but the network.

  # Stores and indexes the logs. Single-node because this is one machine and a
  # second node on the same disk buys no redundancy, only a second copy of the
  # RAM cost.
  #
  # No published port: Logstash and Kibana reach it by service name on `web`,
  # and nothing on the host can.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      # Skips the production bootstrap checks that a real cluster must pass
      # (dedicated masters, seed hosts). Without it the container refuses to
      # start at all on a single-node setup.
      discovery.type: single-node

      # The heap, fixed rather than a share of host RAM. Elasticsearch defaults
      # to half of what it can see, which on a 32 GB laptop reserves 16 GB for a
      # school project running beside eighteen other containers. Both bounds are
      # the same number on purpose: a heap that grows has to pause to do it.
      ES_JAVA_OPTS: -Xms512m -Xmx512m

      # Authentication on. This is what makes "secure access to all components"
      # true rather than aspirational: every client here logs in, including
      # Logstash and Kibana, and Kibana does so as a restricted account rather
      # than as the superuser.
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}

      # TLS inside the cluster is off, and this is the one deliberate weakening
      # in the stack. The traffic never leaves the Docker network, Caddy
      # terminates real TLS at the only entrance, and turning it on here means
      # generating and distributing a CA plus per-node certificates — a
      # meaningful amount of machinery to encrypt a loopback hop. The trade is
      # the same one the Postgres and Redis connections already make.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"

      # Where the snapshot repository is allowed to write. Elasticsearch refuses
      # to register a filesystem repository outside this path, so the archive
      # policy in elasticsearch/setup/setup.sh depends on it.
      path.repo: /snapshots

      # Off for the same reason Grafana's update check is: no outbound traffic
      # from a machine that may be behind a proxy with no route out.
      xpack.security.enrollment.enabled: "false"
    ulimits:
      # Elasticsearch memory-maps its indices and will not start if it can only
      # open a few thousand files. The Docker default is usually 1024.
      nofile:
        soft: 65536
        hard: 65536
      # Locking the heap into RAM is disabled (bootstrap.memory_lock is unset),
      # so this only needs to be non-zero, not unlimited.
      memlock:
        soft: -1
        hard: -1
    volumes:
      # The indices themselves. Losing this volume loses the logs, which is
      # survivable, but not something a `docker compose restart` should do.
      - elasticsearch_data:/usr/share/elasticsearch/data
      # The archive destination. Separate from the data volume on purpose: a
      # backup stored inside the thing it backs up is not a backup.
      - elasticsearch_snapshots:/snapshots
    healthcheck:
      # yellow, not green: a single node cannot allocate the replica shards it
      # is asked for, so a healthy one-node cluster sits at yellow forever.
      # Waiting for green here would mean waiting for a state that never comes.
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"status\"'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      # Elasticsearch takes a while to open its indices on a cold start, and a
      # container marked unhealthy in the meantime would stop everything that
      # waits on it.
      start_period: 90s
    networks:
      - web

  # One-shot. Installs the retention policy, the archive schedule, the index
  # mappings and Kibana's credentials, then exits. Everything it does is a PUT
  # of a named object, so it is safe to run on every boot — which it does,
  # because that is what keeps the configuration in the repository rather than
  # in a volume someone set up by hand once.
  elk_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    # The image's entrypoint starts a node; this only needs its shell and curl.
    entrypoint: ["/bin/bash", "/setup/setup.sh"]
    # Root, solely to fix the ownership of the snapshot volume below. Docker
    # creates a named volume's mount point as root when the path does not exist
    # in the image, and Elasticsearch runs as uid 1000, so without this the
    # archive repository cannot be registered — it fails with access_denied on
    # its own backup directory. The container chowns the one directory and then
    # only makes HTTP calls.
    user: root
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    volumes:
      - ./elasticsearch/setup:/setup:ro
      # Mounted here only so its ownership can be corrected; nothing in this
      # container reads or writes the snapshots themselves.
      - elasticsearch_snapshots:/snapshots
    depends_on:
      elasticsearch:
        condition: service_healthy
    # A one-shot container is "failed" the moment it exits non-zero, and this
    # one exiting non-zero means the cluster is misconfigured. Do not restart it
    # in a loop hiding that.
    restart: "no"
    networks:
      - web

  # Collects the applications' JSON log files from the shared volume, transforms
  # them, and writes them to Elasticsearch. See logstash/pipeline/logstash.conf
  # for why collection is file-based rather than a Docker log driver.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.0
    environment:
      # Read by the pipeline's elasticsearch output. Logstash interpolates
      # ${...} in its config from its own environment.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # Same reasoning as Elasticsearch's heap, at a smaller size: this process
      # holds a batch of events, not an index.
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      # Read-only: this service is a reader of the applications' logs, and a
      # filter bug must not be able to damage the source.
      - app_logs:/logs:ro
      # Holds the sincedb that records how far into each file it has read.
      # Without persistence, a restart re-indexes every existing line.
      - logstash_data:/usr/share/logstash/data
    healthcheck:
      # _health_report is Logstash's own verdict on itself: green when the
      # pipeline is running and its plugins are happy, yellow while it is still
      # coming up or is degraded, red when it has stopped processing. Checking
      # the API merely *answers* would call a Logstash with a dead pipeline
      # healthy, which is the failure this needs to catch.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9600/_health_report | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    depends_on:
      elasticsearch:
        condition: service_healthy
      # The index template and ILM policy must exist before the first document
      # arrives: a document that creates the data stream on its own gets
      # Elasticsearch's guessed mappings and no retention policy, and mappings
      # cannot be changed afterwards without reindexing.
      elk_setup:
        condition: service_completed_successfully
    networks:
      - web

  # Visualisation and dashboards. Reachable only through Caddy's /kibana route,
  # exactly like Grafana — no published port, one TLS certificate for the whole
  # stack, and a login in front of it.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # Not the `elastic` superuser. kibana_system can manage Kibana's own
      # indices and read what it is shown, and nothing else; its password is set
      # by elk_setup.
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}

      # Where Kibana believes it lives, so it prefixes the asset and API paths
      # it generates. rewriteBasePath tells it Caddy does NOT strip the prefix,
      # which is why the Caddy route uses `handle` rather than `handle_path` —
      # the same arrangement Grafana uses above.
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: https://localhost:8443/kibana

      # Encrypts saved objects that contain credentials, and session cookies.
      # Kibana generates a random one at boot if this is unset, which silently
      # invalidates every existing session and saved query on each restart.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}

      # No outbound traffic, for the same reason as Grafana.
      TELEMETRY_ENABLED: "false"
      TELEMETRY_OPTIN: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:5601/kibana/api/status | grep -q '\"level\":\"available\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      # Kibana's first boot migrates its own saved-object indices and is slow.
      start_period: 120s
    depends_on:
      elasticsearch:
        condition: service_healthy
      elk_setup:
        condition: service_completed_successfully
    networks:
      - web

  # One-shot, like elk_setup, but for the half of the configuration that lives
  # in Kibana rather than Elasticsearch: the data view and the dashboards. Runs
  # after Kibana is answering, imports the saved objects from the repository,
  # and exits.
  elk_dashboards:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    entrypoint: ["/bin/bash", "/setup/dashboards.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./elasticsearch/setup:/setup:ro
      - ./kibana/saved-objects:/saved-objects:ro
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    networks:
      - web

# Compose interpolates ${...} in `content`, which is what lets the scrape token
# come from .env like every other secret. Prometheus itself cannot read an
# environment variable from its config file, so it has to arrive as a file.
configs:
  metrics_token:
    content: ${METRICS_TOKEN}
  # MinIO derives this from its own credentials; see .env.example for how to
  # regenerate it when they change.
  minio_metrics_token:
    content: ${MINIO_METRICS_TOKEN}

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  # Written by backend and recommender, read by Logstash. The one piece of
  # shared state between the application and the logging stack.
  app_logs:
  elasticsearch_data:
  elasticsearch_snapshots:
  logstash_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:
  pgdata:
  pgadmin_data:
  minio_data:
  frontend_node_modules:
  backend_node_modules:
  recommender_pip_cache:
