services:
  # Terminates TLS and is the only web port published to the host. Everything
  # else speaks plain HTTP on the internal network, which never leaves Docker.
  # 8443/8080 rather than 443/80: rootless Docker cannot publish privileged
  # ports, so those would make the whole stack fail to start. Keep these in
  # sync with the Caddyfile, which serves the site on the same numbers.
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_HOST: ${APP_HOST}
    depends_on:
      - frontend
      - backend
    networks:
      - web

  frontend:
    build: ./frontend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL}
      - VITE_GOOGLE_ENABLED=${GOOGLE_ENABLED}
      # Not VITE_-prefixed: this is read by vite.config.ts at startup for
      # allowedHosts, never by the browser.
      - APP_HOST=${APP_HOST}
    depends_on:
      - backend
    networks:
      - web

  backend:
    build: ./backend
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules
    environment:
      DB_NAME: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DATABASE_TEST_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_TEST_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_ORIGINS: ${APP_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MFA_KEY: ${MFA_KEY}
      # Bearer token Prometheus must present to scrape GET /metrics. The
      # endpoint is reachable only as backend:3000/metrics on this network —
      # Caddy answers 404 for /api/metrics — and this stops the other services
      # on `web` from reading it.
      METRICS_TOKEN: ${METRICS_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT}
      TMDB_RATE_WINDOW_SECONDS: ${TMDB_RATE_WINDOW_SECONDS}
      RECOMMENDER_URL: ${RECOMMENDER_URL}
      ONBOARDING_MAX_GENRES: ${ONBOARDING_MAX_GENRES}
      ONBOARDING_MAX_ACTORS: ${ONBOARDING_MAX_ACTORS}
      ONBOARDING_MAX_DIRECTORS: ${ONBOARDING_MAX_DIRECTORS}
      REDIS_URL: ${REDIS_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      ACCESS_TTL_SECONDS: ${ACCESS_TTL_SECONDS}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      REFRESH_GRACE_SECONDS: ${REFRESH_GRACE_SECONDS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - web
      - db

  # The recommendation engine (Python/FastAPI), owned by the algorithm team and merged
  # in unmodified. It reads ratings/movies/users straight from Postgres and writes only
  # users.feature_vector, which is its column alone (see
  # recommender/recommendation/INTEGRATION.md).
  #
  # No published port and no Caddy route, deliberately: it holds full database
  # credentials, has no authentication of its own, and its /retrain endpoint does not
  # verify the secret it accepts. Being unreachable from the host is what protects it.
  recommender:
    build: ./recommender
    # Same shape as backend/frontend: the image is only a runtime, the code is mounted,
    # dependencies install at start. --reload gives the algorithm team the edit-and-see-it
    # loop the node services already have.
    command: sh -c "pip install -q -r recommendation/requirements.txt && uvicorn recommendation.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./recommender:/app
      # Not a volume on site-packages, the way node_modules is cached: site-packages holds
      # pip itself, so an empty volume there shadows pip and the install cannot run.
      # Caching the wheel downloads instead turns a ~60s reinstall into ~10s.
      - recommender_pip_cache:/root/.cache/pip
    environment:
      # The same database the backend uses, composed the same way.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # Absent, the service serves a fixed 10-movie stub pool instead of real candidates.
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Guards POST /retrain. Unset means the endpoint refuses every request.
      RETRAIN_SECRET: ${RETRAIN_SECRET}
      # Outbound TMDB pacing, the same variables the backend reads. The ceiling
      # is per process, so this service and the backend each get their own
      # allowance and TMDB sees the sum.
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT}
      TMDB_RATE_WINDOW_SECONDS: ${TMDB_RATE_WINDOW_SECONDS}
    healthcheck:
      # python:3.11-slim ships no curl and the interpreter is already here.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first boot installs numpy/scipy/scikit-learn before uvicorn binds. Without
      # this the container is reported unhealthy during a normal cold start.
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - web

  # Captures every mail the backend sends and shows it in a web UI instead of
  # delivering it. A real SMTP provider would need credentials nobody cloning
  # this repo has, plus outbound network — the feature would be dead on any
  # machine but one. Only the UI port is published; SMTP on 1025 stays internal.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_TEST_NAME: ${DB_TEST_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    # :9000 is deliberately not published. The bucket is private and reachable
    # only from the backend — every file a browser sees comes from GET /files/:id.
    # :9001 is the admin console, a developer tool like pgAdmin (see README).
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - db

  # Pulls /metrics from every target in prometheus/prometheus.yml and keeps the
  # samples in its own time-series database.
  #
  # No published port, deliberately, for the same reason as the recommender: it
  # has no authentication of any kind, and everything it holds — the route
  # table, traffic volumes, login-failure rates — is a map of the system.
  # Grafana will read it over this network; target health is visible there as
  # the `up` metric without needing its web UI. To reach that UI anyway:
  #
  #   docker compose exec prometheus wget -qO- localhost:9090/api/v1/targets
  #
  # and after editing prometheus.yml, reload without losing the stored data:
  #
  #   docker compose exec prometheus wget --post-data='' -qO- localhost:9090/-/reload
  prometheus:
    image: prom/prometheus:v3.14.0
    # Spelled out because setting `command` replaces the image's default
    # arguments rather than adding to them, so the config path has to come back.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Samples older than this are dropped. Two weeks is enough to see a
      # regression against "the same day last week" without the volume growing
      # without bound.
      - --storage.tsdb.retention.time=15d
      # Enables POST /-/reload, so a scrape-config change does not need a
      # restart. Safe here only because nothing outside this network can ask.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume: without it every restart throws away the history, which is
      # the one thing Prometheus exists to keep.
      - prometheus_data:/prometheus
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics_token
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - backend
    networks:
      - web

  # Reads Prometheus and draws it. Holds no metrics of its own: every panel is a
  # PromQL query sent to prometheus:9090 over this network.
  #
  # No published port. The only way in is Caddy's /grafana* route on the app's
  # own origin, which means one TLS certificate for the whole stack instead of a
  # second one to accept, and no plaintext Grafana on a host port next to it.
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      # Where Grafana believes it lives. serve_from_sub_path makes it prefix
      # every asset and API path it generates with /grafana, which is why the
      # Caddy route uses `handle` and does not strip the prefix.
      #
      # The host half is the canonical origin, the same one APP_ORIGINS leads
      # with. Reaching the stack over the LAN via APP_HOST still works: with a
      # sub-path set, the UI links itself relatively and only absolute links
      # Grafana mails out would carry this hostname.
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # --- Access ---
      # The default admin/admin is the single most common way a Grafana ends up
      # world-readable. Required in .env; there is no fallback here on purpose.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Both already default to false. Set explicitly because "we turned it off"
      # and "the version we happened to run defaults to off" are not the same
      # claim, and this file is where that claim has to be checkable.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Caddy terminates TLS in front, so the browser's connection really is
      # https even though Grafana itself speaks plain http on this network.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax

      # --- No outbound traffic ---
      # Update checks, usage reporting, the news feed and gravatar all reach the
      # public internet. Off because none of them are wanted, and because a
      # school machine behind a proxy would otherwise spend every page load
      # waiting on requests that cannot complete.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Grafana ships a list of apps it downloads from grafana.com on first
      # start (Loki and traces explorers). Nothing here uses them, and on a
      # machine without outbound internet the install is retried on every boot.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Datasources and, later, dashboards. Read-only: this is the source of
      # truth, and Grafana must never be able to write back over it.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON the provider above points at.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Grafana's own database — users, sessions, dashboard edits made in the
      # UI. Provisioned files are reapplied on every start, so losing this
      # volume costs the login, not the setup.
      - grafana_data:/var/lib/grafana
    healthcheck:
      # Under the sub-path, because serve_from_sub_path moves the API there too.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/grafana/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
    networks:
      - web

# Compose interpolates ${...} in `content`, which is what lets the scrape token
# come from .env like every other secret. Prometheus itself cannot read an
# environment variable from its config file, so it has to arrive as a file.
configs:
  metrics_token:
    content: ${METRICS_TOKEN}

networks:
  web:
    driver: bridge
  db:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  pgdata:
  pgadmin_data:
  minio_data:
  frontend_node_modules:
  backend_node_modules:
  recommender_pip_cache:
