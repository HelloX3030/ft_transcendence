# The collect-and-transform half of the ELK stack.
#
# Collection is deliberately file-based rather than Docker's gelf/syslog log
# driver or a Filebeat sidecar. Both alternatives couple every other container
# to this one: with a log driver, a container whose logging endpoint is
# unreachable at startup fails to start, so a broken Logstash would take the
# whole application down with it. Filebeat would instead need the Docker socket
# mounted, which hands one container the ability to control the daemon — a poor
# trade in a project that claims a Cybersecurity module. Here the applications
# append JSON lines to a shared volume and Logstash reads them. If Logstash is
# down, files grow and are picked up on its return; nothing else notices.

input {
  file {
    # One file per service, written by the applications themselves. The volume
    # is mounted read-only here: this pipeline is a reader, and a bug in a
    # filter should never be able to corrupt the source.
    path => "/logs/*.log"

    # Each line is already a complete JSON object, so the codec parses it
    # instead of a grok pattern guessing at a text format we control anyway.
    # An unparseable line arrives tagged _jsonparsefailure rather than being
    # dropped, which is why the filter below handles that case explicitly.
    codec => json

    # Start at the top of a file the first time it is seen. Without this,
    # Logstash begins at the end and the first run silently discards every log
    # line written before the stack finished coming up.
    start_position => "beginning"

    # Which byte of which file has already been read. On the data volume, so a
    # `docker compose restart logstash` resumes where it stopped instead of
    # re-indexing every existing line as a duplicate.
    sincedb_path => "/usr/share/logstash/data/sincedb_cinemates"

    # Name the source so a mis-parsed line can be traced back to the file it
    # came from without guessing.
    file_sort_by => "path"
  }
}

filter {
  # A line that is not valid JSON is worth keeping and worth spotting — it
  # means an application wrote something unexpected into the log file, which is
  # itself the kind of incident this stack exists to surface. Keep the raw text
  # in `message`, mark it, and let it through.
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_field => { "service" => "unknown" }
      add_field => { "level" => "error" }
      replace => { "[event][kind]" => "parse_failure" }
    }
  } else {
    # The applications stamp their own time at the moment the event happened.
    # Logstash's @timestamp otherwise records when this pipeline read the line,
    # which drifts from reality whenever Logstash restarts and catches up on a
    # backlog — exactly when accurate times matter most.
    date {
      match => [ "ts", "ISO8601" ]
      target => "@timestamp"
      # Leave the original in place on failure rather than discarding the event,
      # and tag it so the discrepancy is visible in Kibana.
      tag_on_failure => [ "_dateparsefailure" ]
    }
    # Parsed into @timestamp above; keeping both invites two fields that
    # disagree after a timezone change.
    mutate { remove_field => [ "ts" ] }

    # Python's logging and NestJS disagree on case ("WARNING" vs "warn"), and a
    # Kibana filter on level should not have to know which service wrote the
    # line. Normalise to lowercase, then map the two spellings that differ.
    mutate { lowercase => [ "level" ] }
    # Python's logging says WARNING and CRITICAL; NestJS says log and verbose
    # for what everything else calls info and debug. Five names, one vocabulary.
    if [level] == "warning"  { mutate { replace => { "level" => "warn" } } }
    if [level] == "critical" { mutate { replace => { "level" => "fatal" } } }
    if [level] == "log"      { mutate { replace => { "level" => "info" } } }
    if [level] == "verbose"  { mutate { replace => { "level" => "debug" } } }

    # A numeric severity so a dashboard can ask for "warn and above" with a
    # range query instead of enumerating every string it might encounter.
    translate {
      source => "level"
      target => "level_severity"
      dictionary => {
        "debug" => 10
        "info"  => 20
        "warn"  => 30
        "error" => 40
        "fatal" => 50
      }
      fallback => 0
    }
    mutate { convert => { "level_severity" => "integer" } }
  }

  # --- Retrain events ------------------------------------------------------
  # The recommender emits one structured line per nightly retrain attempt,
  # carrying the RetrainResult fields. Coerce them to the types Kibana needs to
  # aggregate on: a number arriving as a string charts as a category, which
  # turns a duration trend into a bar per distinct value.
  if [event][kind] == "retrain" {
    mutate {
      convert => {
        "[retrain][interactions]"      => "integer"
        "[retrain][users]"             => "integer"
        "[retrain][movies]"            => "integer"
        "[retrain][duration_seconds]"  => "float"
      }
    }

    # A single boolean is far easier to build a success-rate panel on than a
    # three-valued status string, and "skipped" is deliberately not a failure:
    # declining to fit a model on too little data is the job working correctly.
    if [retrain][status] == "failed" {
      mutate { add_field => { "[retrain][ok]" => "false" } }
    } else {
      mutate { add_field => { "[retrain][ok]" => "true" } }
    }
    mutate { convert => { "[retrain][ok]" => "boolean" } }

    # Derived at ingest rather than in every panel that wants it. Rows per
    # second is the honest measure of whether the fit is getting slower: raw
    # duration climbs simply because the dataset grew.
    if [retrain][duration_seconds] and [retrain][duration_seconds] > 0 {
      ruby {
        code => '
          rows = event.get("[retrain][interactions]")
          secs = event.get("[retrain][duration_seconds]")
          event.set("[retrain][rows_per_second]", (rows / secs).round(1)) if rows && secs && secs > 0
        '
        tag_on_exception => "_retrainrateerror"
      }
    }
  }

  # Fields Logstash adds that duplicate what is already here or describe the
  # transport rather than the event: which file the line came from, which
  # container read it, and the codec's schema version. Dropped to keep the index
  # small and the field list in Kibana readable.
  # `log` holds only the source file path, `event.original` is a verbatim copy of
  # the line already parsed into fields (indexing it doubles the store for
  # nothing), `host` describes the Logstash container rather than the service
  # that logged, and @version is the codec's schema marker.
  mutate {
    remove_field => [ "log", "[event][original]", "host", "@version" ]
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]

    # Elasticsearch has security enabled, so this connection authenticates like
    # any other client. The password comes from the environment, which comes
    # from .env — never from this file, which is committed.
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"

    # A data stream rather than a plain index. Data streams are append-only and
    # roll over to a fresh backing index on their own, which is what makes the
    # retention policy in elasticsearch/setup/ enforceable: ILM deletes whole
    # backing indices, an operation Elasticsearch does cheaply, instead of
    # issuing delete-by-query against billions of individual documents.
    #
    # The name is fixed by convention as <type>-<dataset>-<namespace>, and the
    # index template registered at setup matches logs-cinemates-* to attach the
    # mappings and the ILM policy.
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "cinemates"
    data_stream_namespace => "default"
  }
}
